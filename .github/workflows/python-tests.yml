name: Python tests

on:
  push:
    branches: [develop, Claude] # TODO(release): remove temporary Claude trigger
  pull_request:
    branches: [main]

jobs:
  supply-chain:
    name: Dependency pins and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python scripts/check_pins.py
      # The gitleaks CLI (MIT), not gitleaks-action, which needs a licence for an
      # organisation repository. To bump: new version, SHA-256 from its checksums.txt.
      - name: gitleaks over the working tree
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv pip install ".[test]" --system -v

      - name: Test
        run: uv run pytest tests/python/ -v --tb=short

      - name: System check
        run: uv run python -c "import dtwcpp; dtwcpp.check_system()"
