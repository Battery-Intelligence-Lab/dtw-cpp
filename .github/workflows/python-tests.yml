name: Python tests

on:
  push:
    branches: [develop, Claude] # TODO(release): remove temporary Claude trigger
  pull_request:
    branches: [main]

jobs:
  supply-chain:
    name: Dependency pins and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python scripts/check_pins.py
      # The gitleaks CLI (MIT), not gitleaks-action, which needs a licence for an
      # organisation repository. To bump: new version, SHA-256 from its checksums.txt.
      - name: gitleaks over the working tree
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --exit-code 1 .

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp && brew link --force libomp

      - name: Install
        run: uv pip install ".[test,dev,io,mip]" pandas --system -v

      # The extension links no HiGHS, so method="mip" solves with highspy (the mip extra).
      # test_mip.py and test_wheel_smoke.py skip only without highspy or with linked HiGHS; the
      # Test step sets DTWC_REQUIRE_HIGHSPY, which makes such a skip fail the job, and this
      # step fails earlier and names the cause.
      - name: The MIP tests run on highspy
        run: uv run python -c "import highspy, dtwcpp; assert not dtwcpp.HIGHS_AVAILABLE"

      # The wheel carries no CLI. test_api, test_hpc and test_version_ssot drive dtwc_cl and
      # tests/conformance/test_conformance.py runs its CLI route on it; DTWC_CL_PATH names it.
      - name: Build dtwc_cl
        run: |
          cmake -S . -B build -DDTWC_BUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target dtwc_cl --parallel 2

      # Both paths are job arguments, not pyproject testpaths: an explicit argument overrides
      # testpaths, so the one place that can name tests outside tests/python is this line.
      # DTWC_CL_PATH set to a missing file raises, so the CLI cases cannot skip here;
      # DTWC_REQUIRE_HIGHSPY fails the cases that need highspy instead of skipping them.
      - name: Test
        env:
          DTWC_CL_PATH: ${{ github.workspace }}/build/bin/dtwc_cl${{ runner.os == 'Windows' && '.exe' || '' }}
          DTWC_REQUIRE_HIGHSPY: "1"
        run: uv run pytest tests/python/ tests/conformance/test_conformance.py -v --tb=short

      - name: System check
        run: uv run python -c "import dtwcpp; print(dtwcpp.test.parallelisation()); print(dtwcpp.gpu_info())"
