name: Python tests

on:
  push:
    branches: [develop, Claude] # TODO(release): remove temporary Claude trigger
  pull_request:
    branches: [main]

jobs:
  supply-chain:
    name: Immutable workflow and archive pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python scripts/check_supply_chain_pins.py

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv pip install ".[test]" --system -v

      - name: Test
        run: uv run pytest tests/python/ -v --tb=short

      - name: System check
        run: uv run python -c "import dtwcpp; dtwcpp.check_system()"
