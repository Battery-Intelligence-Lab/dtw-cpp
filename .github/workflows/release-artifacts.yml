name: Native release archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  archive:
    name: Archive on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Without an explicit target the archive inherits the runner's macOS
          # and runs on nothing older. 13.3 is the first libc++ with the
          # floating-point std::to_chars the CSV writers use (the wheels use the
          # same target, python-wheels.yml; smoke_release_archive.py enforces it).
          - os: macos-latest
            macos_target: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build macOS OpenMP runtime for 13.3
        if: runner.os == 'macOS'
        # The archive bundles the libomp it links (lib/), and Homebrew's is built
        # for the runner's macOS (minos 26.0), so the archive would not start
        # below 26 whatever the deployment target above. The script builds the
        # same LLVM release for 13.3; OpenMP_ROOT points find_package(OpenMP) at
        # it (CMP0074, CMake >= 3.26 here), and the smoke step checks every
        # Mach-O in the archive.
        run: |
          bash scripts/build_libomp_macos.sh "$RUNNER_TEMP/libomp"
          echo "OpenMP_ROOT=$RUNNER_TEMP/libomp" >> "$GITHUB_ENV"

      - name: Configure release CLI
        # DTWC_ARCH_LEVEL=v3 is required, not tidiness. The default for a top-level
        # C++ configure is native (-march=native), which tunes the *published*
        # binary for whichever CPU this ephemeral runner happened to have; a user on
        # an older machine then gets SIGILL on an instruction their CPU does not
        # implement. v3 is the CPU floor of a release: x86-64-v3, AVX2 and FMA
        # (Intel 2013+, AMD 2015+). On the arm64 macOS runner it adds no flag.
        # smoke_release_archive.py cannot catch the difference: it runs the binary on
        # the machine that built it, where every instruction is of course supported.
        run: >-
          cmake -S . -B build/release
          -DDTWC_ENABLE_GUROBI=OFF
          -DDTWC_ENABLE_HIGHS=ON
          -DDTWC_ENABLE_LLFIO=ON
          -DDTWC_BUILD_TESTING=OFF
          -DDTWC_ARCH_LEVEL=v3
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.macos_target }}

      - name: Build CLI and dependency notices
        run: cmake --build build/release --config Release --target dtwc_cl write-licenses --parallel 2

      - name: Package
        working-directory: build/release
        run: cpack -C Release

      - name: Smoke unpacked archive outside checkout
        run: python scripts/smoke_release_archive.py build/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dtwc-native-${{ matrix.os }}
          path: |
            build/release/dtwc-*.zip
            build/release/dtwc-*.tar.gz
            build/release/dtwc-*.sha256
          if-no-files-found: error
