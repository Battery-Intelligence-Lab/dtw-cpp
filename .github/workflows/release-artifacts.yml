name: Native release archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  archive:
    name: Archive on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install macOS OpenMP runtime
        if: runner.os == 'macOS'
        # libomp is keg-only, so `brew install` alone leaves nothing in a prefix
        # CMake searches and find_package(OpenMP) fails — which dtwc/CMakeLists.txt
        # turns into a configure FATAL_ERROR. Other workflows use
        # `brew link --force libomp`; OpenMP_ROOT does the same job without
        # writing into the Homebrew prefix (CMP0074, CMake >= 3.26 here).
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Configure release CLI
        # DTWC_ENABLE_NATIVE_ARCH=OFF is required, not tidiness. It defaults ON,
        # and this is a top-level non-Python configure, so without it
        # StandardProjectSettings.cmake applies -march=native — tuning the
        # *published* binary for whichever CPU this ephemeral runner happened to
        # have. A user on an older machine then gets SIGILL on an instruction
        # their CPU does not implement. The wheels already opt out via the
        # DTWC_BUILD_PYTHON guard "to keep wheel binaries portable"; the same
        # reasoning applies here and was simply never extended to the archives.
        # smoke_release_archive.py cannot catch it: it runs the binary on the
        # machine that built it, where every instruction is of course supported.
        # Set -DDTWC_ARCH_LEVEL=v3 instead if a vectorised release baseline
        # (AVX2+FMA, Haswell and later) is ever wanted deliberately.
        run: >-
          cmake -S . -B build/release
          -DDTWC_ENABLE_GUROBI=OFF
          -DDTWC_ENABLE_HIGHS=ON
          -DDTWC_ENABLE_LLFIO=OFF
          -DDTWC_BUILD_TESTING=OFF
          -DDTWC_ENABLE_NATIVE_ARCH=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI and dependency notices
        run: cmake --build build/release --config Release --target dtwc_cl write-licenses --parallel 2

      - name: Package
        working-directory: build/release
        run: cpack -C Release

      - name: Smoke unpacked archive outside checkout
        run: python scripts/smoke_release_archive.py build/release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dtwc-native-${{ matrix.os }}
          path: |
            build/release/dtwc-*.zip
            build/release/dtwc-*.tar.gz
            build/release/dtwc-*.sha256
          if-no-files-found: error
