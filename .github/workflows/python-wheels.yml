name: Python wheels

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish this v* ref to real PyPI after all release gates"
        required: false
        default: false
        type: boolean

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: Linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macOS-arm64
            os: macos-latest
            arch: arm64
          - name: Windows-AMD64
            os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true

      - uses: pypa/cibuildwheel@8d2b08b68458a16aeb24b64e68a09ab1c8e82084 # v3.4.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_ARCHS: "${{ matrix.arch }}"

          # macOS: arm64 ONLY (x86_64 DROPPED — Task 3.4, build-state 2026-07-06 hole 4).
          # The GitHub `macos-latest` runner is Apple Silicon (arm64); the
          # libomp that CIBW_BEFORE_ALL_MACOS builds below is arm64-only, so a
          # cross-compiled x86_64 wheel's find_package(OpenMP) finds nothing and
          # would ship SERIAL. Three reasons this is a hard drop, not a "fix later":
          #   1. no-silent-fallback global constraint forbids shipping a serial wheel;
          #   2. Task 3.1 makes missing OpenMP a configure FATAL_ERROR, so the
          #      x86_64 cross-build would hard-fail the whole macOS wheel job anyway;
          #   3. cibuildwheel cannot run CIBW_TEST_COMMAND (below) on a cross-arch
          #      wheel, so the OpenMP belt-and-braces could never verify x86_64.
          # Re-add x86_64 ONLY behind a genuine x86_64 libomp on an Intel runner.
          CIBW_ARCHS_MACOS: "arm64"

          # Release build with header-only llfio (the memory-mapped distance
          # matrix) and no MIP solver: method="mip" solves with the user's
          # highspy (the mip extra); Gurobi stays external.
          # DTWC_BUILD_PYTHON=ON makes DTWC_ARCH_LEVEL default to v3, the CPU floor
          # of every x86-64 wheel (AVX2 and FMA); arm64 wheels get no level flag.
          CIBW_CONFIG_SETTINGS: >-
            cmake.args=-DDTWC_BUILD_PYTHON=ON
            cmake.args=-DDTWC_ENABLE_GUROBI=OFF
            cmake.args=-DDTWC_ENABLE_HIGHS=OFF
            cmake.args=-DDTWC_ENABLE_LLFIO=ON
            cmake.args=-DDTWC_BUILD_TESTING=OFF
            cmake.args=-DDTWC_BUILD_BENCHMARK=OFF
            cmake.args=-DCMAKE_BUILD_TYPE=Release

          # 13.3 (Ventura, March 2023) is the first macOS whose libc++ has the
          # floating-point std::to_chars the CSV writers use; floating-point
          # from_chars would need 26.0, which is why text parsing goes through
          # the vendored fast_float (dtwc/io/parse_number.cpp) instead. The
          # release CLI archive uses the same target (release-artifacts.yml).
          # The target also binds the wheel: delocate-wheel reads
          # MACOSX_DEPLOYMENT_TARGET and fails the repair if any Mach-O it
          # bundles needs a newer macOS. Homebrew's libomp is built for the
          # runner's macOS (minos 26.0) and would fail it, so CIBW_BEFORE_ALL_MACOS
          # builds the same LLVM release for this target; OpenMP_ROOT points
          # find_package(OpenMP) at it (without it Task 3.1's configure
          # FATAL_ERROR fires).
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=13.3
            OpenMP_ROOT=$RUNNER_TEMP/libomp
          CIBW_BEFORE_ALL_MACOS: bash scripts/build_libomp_macos.sh "$OpenMP_ROOT"
          CIBW_BUILD_VERBOSITY: 1

          # Execute a real OpenMP region, solve a compact conformance subset
          # through the MIP path with highspy (the mip extra, installed for the
          # test) and map a distance matrix to a file and reopen it (llfio) in
          # every produced wheel, and check the wheel carries the SLURM wrapper
          # device='hpc' runs (FX-5).
          CIBW_TEST_EXTRAS: mip
          CIBW_TEST_COMMAND: >-
            python -c "from dtwcpp._wheel_smoke import run; run()" &&
            python -c "import os, dtwcpp._hpc as h; d = os.path.dirname(h.slurm_wrapper_path()); assert all(os.path.isfile(os.path.join(d, f)) for f in ('slurm_remote.sh', 'cluster_generic.slurm')), d"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: true

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - run: uv build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Upload to Test PyPI on every tag push (for verification)
  publish-test:
    name: Publish to Test PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  # Real PyPI is manual: dispatch on a v* ref with publish_pypi=true only after
  # reviewing every platform artifact. A tag push alone stops at TestPyPI.
  publish:
    name: Publish to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_pypi &&
      startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist, publish-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - run: uv publish dist/*
