name: Build, test and generate docs
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v6

      - name: Set up Python for generated-doc and drift gates
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify generated documentation and live API contract
        run: python scripts/check_docs_contract.py

      # --- Hugo build ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.8'
          extended: true

      - name: Build Hugo site
        working-directory: docs
        run: |
          hugo mod get
          hugo --minify --baseURL "https://battery-intelligence-lab.github.io/dtw-cpp/"

      - name: Build Pagefind search index
        working-directory: docs
        run: npx pagefind@1.3.0 --site public --output-subdir _pagefind

      # --- Doxygen API reference ---
      - run: mkdir -p build
      - name: Create Doxygen Files
        uses: mattnotmitt/doxygen-action@v1.12.0
        with:
          doxyfile-path: 'docs/Doxyfile'
      - run: sed -ri 's/<div id="projectname">(.*)/<div id="projectname"><a href="..\/index.html">\1 <\/a>/g' ./build/Doxygen/html/index.html
      - run: mv ./build/Doxygen/html ./docs/public/Doxygen
      - run: cp -r ./media ./docs/public/Doxygen

      # --- C++ build, test, and coverage report ---
      - name: Install compiler and dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-13 g++-13 lcov

      - name: CMake configure
        run: >-
          cmake -B build_dir
          -DCMAKE_BUILD_TYPE=Debug
          -DDTWC_ENABLE_COVERAGE:BOOL=TRUE
          -DDTWC_BUILD_TESTING=ON
          -DDTWC_BUILD_EXAMPLES=ON
          -DDTWC_ENABLE_HIGHS=OFF
          -DDTWC_ENABLE_GUROBI=OFF
          -DDTWC_ENABLE_LLFIO=OFF
        env:
          CC: gcc-13
          CXX: g++-13

      - name: CMake build
        run: cmake --build build_dir --parallel 2

      - name: Run tests
        run: ctest -j2 -C Debug --output-on-failure
        working-directory: build_dir

      - name: Execute documented C++ quickstart verbatim
        run: ./build_dir/bin/example_quickstart tests/conformance/data/conformance_series.csv

      - name: Diff documented CLI flags against live --help
        run: python scripts/check_docs_contract.py --cli build_dir/bin/dtwc_cl

      # Generate the lcov trace file (also consumed by genhtml below).
      - name: Generate coverage info
        run: |
          lcov --directory ./tests --capture --output-file coverage.info
          lcov --remove coverage.info '*/tests/*' '/_deps/*' '/usr/*' '*/catch2/*' --output-file coverage.info
          lcov --list coverage.info
        working-directory: build_dir

      # Task 0.12 supply-chain fix: the previous step fetched Codecov's legacy
      # shell uploader over the network and piped it straight into a shell WITH
      # the Codecov token in the environment — i.e. remote code execution and
      # token exposure on every PR run. Replaced by the official maintained
      # action below.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build_dir/coverage.info
          fail_ci_if_error: false

      - name: Generate LCOV HTML report
        run: genhtml coverage.info -o Coverage
        working-directory: build_dir

      - run: mv ./build_dir/Coverage ./docs/public/Coverage

      - name: Check every internal link in the built site
        run: python scripts/check_site_links.py docs/public --base-path /dtw-cpp/

      # --- Upload combined site artifact ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  # Publication job
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
