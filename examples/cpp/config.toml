# DTWC++ Configuration File
#
# Usage: dtwc_cl --config examples/cpp/config.toml
#
# All options can also be set via command line flags.
# Command line flags override values from this file.
# `dtwc_cl ... --print-config` writes every key of a command line as such a file.

# Input CSV file or folder containing time series data.
# A file holds one series per row; a folder holds one series per file, one value
# per line. data/dummy is a folder of pandas `index,value` files, hence the
# skip-rows / skip-cols below.
input = "data/dummy"

# Output directory for results (labels, medoids, silhouettes, distance matrix).
output = "./results"

# Problem name used in output filenames (e.g., "myrun_labels.csv").
name = "example"

# Number of clusters. (Deprecated key `clusters` is still accepted with a warning.)
n-clusters = 5

# Clustering method: "auto", "pam", "onebatch", "clara", "kmedoids", "mip",
# "lrcore", "hierarchical", "tadpole"
method = "pam"

# Sakoe-Chiba band width. -1 = full (unconstrained) DTW.
band = -1

# Distance metric: "l1", "squared_euclidean"
metric = "l1"

# DTW variant: "standard", "ddtw", "wdtw", "adtw", "softdtw", "msm", "twe"
variant = "standard"

# Missing-data strategy: "error", "zero_cost", "arow", "interpolate"
missing-strategy = "error"

# Maximum iterations for iterative algorithms.
max-iter = 100

# Number of random restarts (PAM/kMedoids Lloyd).
n-init = 1

# CSV parsing: rows and columns to skip (e.g., for headers or index columns).
# data/dummy: skip the `,0` header row and the index column.
skip-rows = 1
skip-cols = 1
# Field delimiter, one character; unset infers tab for .tsv/.txt, else ",".
# delimiter = ","

# Column to use as the time series values when loading from Parquet/Arrow IPC.
# Leave unset (or empty) to use all numeric columns. Only valid for a
# .parquet/.pq input; the CSV `input` above rejects it rather than ignoring it.
# column = "Voltage"

# Data type for in-memory storage.
# "float64" (default, full precision) or "float32" (2x series-storage saving).
# Aliases: f32, fp32, float -> float32; f64, fp64, double -> float64.
dtype = "float64"

# Verbose output.
verbose = true

# --- DTW variant parameters ---
# WDTW logistic weight steepness (only used when variant = "wdtw").
wdtw-g = 0.05

# ADTW non-diagonal step penalty (only used when variant = "adtw").
adtw-penalty = 1.0

# Soft-DTW smoothing parameter (only used when variant = "softdtw").
sdtw-gamma = 1.0

# --- CLARA-specific options (only used when method = "clara") ---
# Subsample size. -1 = auto (the larger of 40 + 2k and 10k + 100, at most N).
sample-size = -1

# Number of subsamples to try.
n-samples = 5

# Random seed: PAM, OneBatchPAM, CLARA and the MIP warm start.
seed = 42

# --- Checkpointing ---
# Uncomment to enable checkpoint save/resume:
# checkpoint = "./checkpoints"
# Save every N filled distance-matrix rows as well; 0 = once, at the end.
# checkpoint-interval = 0

# --- MIP solver (only used when method = "mip") ---
# Solver: "highs", "gurobi"
solver = "highs"

# MIP optimality gap tolerance (default: 1e-5).
mip-gap = 1e-5

# MIP solver time limit in seconds (-1 = unlimited).
time-limit = -1

# Gurobi NumericFocus (0-3, default: 1). Higher = more numeric care, slower.
numeric-focus = 1

# Gurobi MIPFocus (0=balanced, 1=find feasible, 2=prove optimal, 3=bound).
mip-focus = 2

# Show detailed MIP solver log output.
verbose-solver = false

# Uncomment to disable FastPAM warm start for MIP:
# no-warm-start = true

# --- Compute device ---
# "cpu" (default), "gpu", or "gpu:N" for a specific GPU ("cuda", "cuda:N" are
# the same): CUDA on NVIDIA, Metal on macOS. The GPU fills the distance matrix
# of pam, kmedoids, mip, lrcore, hierarchical, and clara when its sample covers
# every series; onebatch, tadpole and a smaller clara sample are refused. It
# takes variant = "standard", missing-strategy = "error" and dtype = "float64".
# A run computes where it starts: to submit to SLURM use slurm_remote.sh.
device = "cpu"

# GPU kernel precision: "auto" (FP32 on consumer GPUs, FP64 on HPC GPUs),
# "fp32"/"f32"/"float32" (fastest, ~1e-5 relative error),
# "fp64"/"f64"/"float64"/"double" (bit-identical to CPU).
gpu-precision = "auto"

# --- Precomputed distance matrix ---
# Uncomment to load a precomputed distance matrix:
# dist-matrix = "path/to/distance_matrix.csv"
