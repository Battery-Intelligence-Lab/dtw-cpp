# DTWC++ 2.0 cross-language conformance fixture (CLI route via `dtwc_cl --config`).
# Input and output paths are passed on the command line (-i / -o).
# Keep in lockstep with cpp_conformance.cpp, test_conformance.py and test_conformance.m.

n-clusters = 3
method     = "pam"
band       = 3
metric     = "l1"
variant    = "standard"
max-iter   = 100
name       = "conformance"
