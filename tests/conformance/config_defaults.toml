# Golden text of `dtwc_cl --print-config` with no other argument: every Config key
# at its default, in cli::bind() order (tests/integration/test_cli_device_matrix.cmake).
# name "" is the input's file or folder name, n-clusters 0 is not given (a run refuses
# it), gpu-share -1 measures, and CLI11 writes not-computed's nan bare.
input = ""
output = "./results"
name = ""
column = ""
dtype = "float64"
matrix-dtype = "float64"
ram-limit = 0
n-clusters = 0
method = "auto"
band = -1
metric = "l1"
variant = "standard"
max-iter = 100
n-init = 1
dc = -1
wdtw-g = 0.05
adtw-penalty = 1
sdtw-gamma = 1
msm-c = 1
twe-nu = 0.001
twe-lambda = 1
mv-mode = "dependent"
missing-strategy = "error"
sample-size = -1
n-samples = 5
seed = 42
batch-size = -1
linkage = "average"
skip-rows = 0
skip-cols = 0
delimiter = ""
dist-matrix = ""
not-computed = nan
checkpoint = ""
checkpoint-interval = 0
solver = "highs"
mip-gap = 1e-05
time-limit = -1
no-warm-start = false
numeric-focus = 1
mip-focus = 2
verbose-solver = false
lr-max-nodes = 2000000
device = "cpu"
gpu-precision = "auto"
gpu-share = -1
fallback = false
verbose = false
no-report = false
