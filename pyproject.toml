[build-system]
requires = ["scikit-build-core>=1.0", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "dtwcpp"
dynamic = ["version"]
description = "DTWC++ — Fast Dynamic Time Warping and Clustering"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [
    { name = "Volkan Kumtepeli" },
    { name = "Rebecca Perriment" },
    { name = "David A. Howey" },
]
maintainers = [
    { name = "Volkan Kumtepeli" },
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["dtw", "dynamic-time-warping", "clustering", "time-series", "k-medoids"]

[project.urls]
Homepage = "https://github.com/Battery-Intelligence-Lab/dtw-cpp"
Documentation = "https://battery-intelligence-lab.github.io/dtw-cpp/"
Repository = "https://github.com/Battery-Intelligence-Lab/dtw-cpp"
Issues = "https://github.com/Battery-Intelligence-Lab/dtw-cpp/issues"
Changelog = "https://github.com/Battery-Intelligence-Lab/dtw-cpp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=6.0"]
sklearn = ["scikit-learn>=1.0"]
hdf5 = ["h5py>=3.0"]
parquet = ["pyarrow>=12.0"]
io = ["h5py>=3.0", "pyarrow>=12.0"]
dev = ["pytest>=6.0", "scikit-learn>=1.0"]

[project.scripts]
dtwc-convert = "dtwcpp.convert:main"

[tool.scikit-build]
cmake.version = ">=3.26"
ninja.version = ">=1.11"
cmake.args = ["-DDTWC_BUILD_PYTHON=ON", "-DDTWC_ENABLE_GUROBI=OFF", "-DDTWC_ENABLE_HIGHS=ON", "-DDTWC_ENABLE_LLFIO=OFF"]
wheel.packages = ["python/dtwcpp"]
wheel.exclude = ["include/**", "lib/**", "bin/**", "share/**"]
sdist.exclude = ["build/**", "build_*/**", "docs/public*/**"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION"
regex = '''^(?P<value>[0-9]+(?:\.[0-9]+)*(?:(?:a|b|rc)[0-9]+|\.post[0-9]+|\.dev[0-9]+)?)\s*$'''
